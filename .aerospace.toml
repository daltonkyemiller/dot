# AeroSpace config — mirrors the Hyprland setup (Cmd = Super):
#   focus  cmd+hjkl · move/swap  cmd+alt+hjkl · resize  cmd+shift+hjkl
#   workspaces  cmd+1-9 / cmd+shift+1-9

after-login-command = []
after-startup-command = []

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Warp mouse to the focused monitor (parity with OmniWM's mouseWarp)
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# If a cmd-h ever slips through and hides an app, bring it back automatically
automatically-unhide-macos-hidden-apps = true

[key-mapping]
    preset = 'qwerty'

# Hyprland gaps: gaps_in 5; gaps_out 5(top), 20, 20, 20
[gaps]
    inner.horizontal = 5
    inner.vertical =   5
    outer.left =       20
    outer.bottom =     20
    outer.top =        5
    outer.right =      20

# Emoji workspaces live on the secondary monitor (OmniWM parity), rest on main
[workspace-to-monitor-force-assignment]
    6 = ['secondary', 'main']
    7 = ['secondary', 'main']

[mode.main.binding]

    # Layouts: cmd-m toggles tiles/accordion (was Super+M master/dwindle toggle)
    cmd-m = 'layout tiles accordion'
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Focus: cmd + hjkl
    cmd-h = 'focus left'
    cmd-j = 'focus down'
    cmd-k = 'focus up'
    cmd-l = 'focus right'

    # Move/swap window: cmd + alt + hjkl (hyprland movewindow / omniwm swap)
    cmd-alt-h = 'move left'
    cmd-alt-j = 'move down'
    cmd-alt-k = 'move up'
    cmd-alt-l = 'move right'

    # Resize: hyprland resizeactive semantics — the delta moves the window's
    # controlling edge in the pressed direction (h grows a rightmost window,
    # shrinks others, etc.). Needs the script: aerospace's native resize is
    # magnitude-only and its CLI exposes no window geometry.
    cmd-shift-h = 'exec-and-forget ~/dev/dot/scripts/wm-resize-dir.sh left'
    cmd-shift-j = 'exec-and-forget ~/dev/dot/scripts/wm-resize-dir.sh down'
    cmd-shift-k = 'exec-and-forget ~/dev/dot/scripts/wm-resize-dir.sh up'
    cmd-shift-l = 'exec-and-forget ~/dev/dot/scripts/wm-resize-dir.sh right'

    # Coarse fallback resize:
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Fullscreen (OmniWM parity: Option+Return)
    alt-enter = 'fullscreen'

    # Workspaces: cmd + [1-9]
    cmd-1 = 'workspace 1'
    cmd-2 = 'workspace 2'
    cmd-3 = 'workspace 3'
    cmd-4 = 'workspace 4'
    cmd-5 = 'workspace 5'
    cmd-6 = 'workspace 6'
    cmd-7 = 'workspace 7'
    cmd-8 = 'workspace 8'
    cmd-9 = 'workspace 9'

    # Move window to workspace: cmd + shift + [1-9]
    cmd-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    cmd-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    cmd-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    cmd-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    cmd-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    cmd-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    cmd-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    cmd-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    cmd-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

    # Float toggle (hyprland Super+Shift+F)
    cmd-shift-f = 'layout floating tiling'

    # Workspace back-and-forth on alt-tab (kept from old config / OmniWM)
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Swallow cmd-shift-q so a missed cmd-shift-[digit] can't trigger macOS logout
    cmd-shift-q = []

    cmd-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
