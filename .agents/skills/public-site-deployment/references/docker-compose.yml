x-hardened: &hardened
  network_mode: host
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  security_opt:
    - no-new-privileges:true

services:
  private-caddy:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile
    image: caddy-private:2.10.2-spaceship
    volumes:
      - ./Caddyfile.private:/etc/caddy/Caddyfile:ro
      - /root/.hermes/artifacts/daily-brief:/srv/daily-brief:ro
      - caddy-private-data:/data
      - caddy-private-config:/config
    secrets:
      - spaceship_api_key
      - spaceship_api_secret
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  public-caddy:
    <<: *hardened
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    entrypoint: ["caddy"]
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile.public:/etc/caddy/Caddyfile:ro
      - ./public-sites:/etc/caddy/public-sites:ro
      - /srv/public-sites:/srv/public-sites:ro
      - caddy-public-data:/data
      - caddy-public-config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2020/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  caddy-private-data:
    name: caddy-private_caddy-data
  caddy-private-config:
    name: caddy-private_caddy-config
  caddy-public-data:
  caddy-public-config:

secrets:
  spaceship_api_key:
    file: /etc/tailnet-web/secrets/spaceship_api_key
  spaceship_api_secret:
    file: /etc/tailnet-web/secrets/spaceship_api_secret
